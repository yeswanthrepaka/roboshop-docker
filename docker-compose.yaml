services:
  frontend:
    build: ./frontend
    image: yeswanthrepaka/frontend:1.0.0
    container_name: frontend
    ports: 
    - "8080:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment
  catalogue:
    build: ./catalogue
    image: yeswanthrepaka/catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb
  user:
    build: ./user
    image: yeswanthrepaka/user:1.0.0
    container_name: user
    depends_on:
    - mongodb
    - redis
  cart: 
    build: ./cart
    image: yeswanthrepaka/cart:1.0.0
    container_name: cart
    depends_on:
    - catalogue
    - redis
  shipping:
    build: ./shipping
    image: yeswanthrepaka/shipping:1.0.0
    container_name: shipping
    depends_on:
    - cart
    - mysql
  payment:
    build: ./payment
    image: yeswanthrepaka/payment:1.0.0
    container_name: payment
    depends_on:
    - cart
    - user
    - rabbitmq
  mongodb:
    build: ./mongodb
    image: yeswanthrepaka/mongodb:1.0.0
    container_name: mongodb
  redis:
    image: redis:7.0
    container_name: redis
  mysql:
    build: ./mysql
    image: yeswanthrepaka/mysql:1.0.0
    container_name: mysql
    environment: 
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
  rabbitmq: 
    image: rabbitmq:3
    container_name: rabbitmq
    environment: 
      RABBITMQ_DEFAULT_USER: "roboshop"
      RABBITMQ_DEFAULT_PASS: "roboshop123"

networks:
  default:
    name: roboshop
    driver: bridge
    external: false

    